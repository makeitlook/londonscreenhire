<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!--
    TEMPORARY PLACEHOLDER — replace with London Screen Hire event photography.
    Simulates: dark stage left, large bright LED screen right, audience silhouettes,
    warm overhead lighting. No real imagery, no company branding.
  -->
  <defs>
    <!-- Stage floor gradient -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12161e"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <!-- LED screen blue glow -->
    <radialGradient id="screen-glow" cx="75%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#2a7fff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0868f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0868f7" stop-opacity="0"/>
    </radialGradient>
    <!-- Warm overhead lighting -->
    <radialGradient id="light-spot-1" cx="65%" cy="10%" r="25%">
      <stop offset="0%" stop-color="#fff4d6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light-spot-2" cx="85%" cy="8%" r="18%">
      <stop offset="0%" stop-color="#c8e0ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c8e0ff" stop-opacity="0"/>
    </radialGradient>
    <!-- LED pixel tile pattern for screen surface -->
    <pattern id="led-px" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="6.5" height="6.5" fill="#1a6fff" rx="0.5"/>
    </pattern>
    <mask id="screen-mask">
      <rect x="900" y="60" width="820" height="580" rx="4" fill="white"/>
    </mask>
  </defs>

  <!-- Base dark background -->
  <rect width="1920" height="1080" fill="url(#floor)"/>

  <!-- Stage floor — lighter reflection strip -->
  <rect x="0" y="820" width="1920" height="260" fill="#0d1018" opacity="0.9"/>
  <rect x="0" y="820" width="1920" height="4" fill="rgba(255,255,255,0.04)"/>

  <!-- Large LED screen panel — right side -->
  <!-- Screen body -->
  <rect x="900" y="60" width="820" height="580" rx="4" fill="#0d2a5e"/>
  <!-- LED pixel surface -->
  <rect x="900" y="60" width="820" height="580" rx="4" fill="url(#led-px)" opacity="0.18" mask="url(#screen-mask)"/>
  <!-- Screen content — abstract bright blue/white event graphic -->
  <rect x="900" y="60" width="820" height="580" rx="4" fill="none"/>
  <!-- Bright content areas -->
  <rect x="920" y="80" width="780" height="540" rx="2" fill="#0a55d4" opacity="0.7"/>
  <rect x="940" y="100" width="740" height="200" fill="#1a6fff" opacity="0.6"/>
  <rect x="940" y="100" width="740" height="200" fill="url(#led-px)" opacity="0.3"/>
  <!-- Bright white highlight band -->
  <rect x="960" y="120" width="700" height="40" fill="rgba(255,255,255,0.55)" rx="2"/>
  <rect x="960" y="170" width="500" height="20" fill="rgba(255,255,255,0.35)" rx="2"/>
  <rect x="960" y="200" width="360" height="14" fill="rgba(255,255,255,0.22)" rx="2"/>
  <!-- Lower content bands -->
  <rect x="940" y="340" width="740" height="260" fill="#0550c8" opacity="0.55"/>
  <rect x="960" y="360" width="460" height="30" fill="rgba(255,255,255,0.28)" rx="2"/>
  <rect x="960" y="400" width="320" height="20" fill="rgba(255,255,255,0.18)" rx="2"/>
  <!-- Screen edge frame / bezel -->
  <rect x="900" y="60" width="820" height="580" rx="4" fill="none" stroke="#0428a0" stroke-width="6"/>
  <!-- Screen top mount bar -->
  <rect x="1220" y="30" width="180" height="32" rx="2" fill="#1a1e26"/>
  <rect x="1260" y="0" width="100" height="30" rx="1" fill="#141720"/>

  <!-- Truss / rigging structure above screen -->
  <rect x="850" y="28" width="940" height="10" rx="2" fill="#22262f"/>
  <rect x="870" y="18" width="6" height="40" fill="#1a1e26"/>
  <rect x="960" y="18" width="6" height="40" fill="#1a1e26"/>
  <rect x="1100" y="18" width="6" height="40" fill="#1a1e26"/>
  <rect x="1300" y="18" width="6" height="40" fill="#1a1e26"/>
  <rect x="1500" y="18" width="6" height="40" fill="#1a1e26"/>
  <rect x="1620" y="18" width="6" height="40" fill="#1a1e26"/>
  <rect x="1720" y="18" width="6" height="40" fill="#1a1e26"/>

  <!-- Moving head lights on truss -->
  <!-- Light 1 -->
  <circle cx="900" cy="22" r="8" fill="#2a2f3a"/>
  <ellipse cx="900" cy="36" rx="4" ry="14" fill="rgba(255,240,180,0.22)" transform="rotate(-8,900,36)"/>
  <!-- Light 2 -->
  <circle cx="1060" cy="22" r="8" fill="#2a2f3a"/>
  <ellipse cx="1060" cy="36" rx="4" ry="18" fill="rgba(180,220,255,0.30)" transform="rotate(4,1060,36)"/>
  <!-- Light 3 -->
  <circle cx="1360" cy="22" r="8" fill="#2a2f3a"/>
  <ellipse cx="1360" cy="36" rx="4" ry="16" fill="rgba(255,240,180,0.20)" transform="rotate(-12,1360,36)"/>
  <!-- Light 4 -->
  <circle cx="1600" cy="22" r="8" fill="#2a2f3a"/>
  <ellipse cx="1600" cy="36" rx="4" ry="20" fill="rgba(180,220,255,0.25)" transform="rotate(6,1600,36)"/>
  <!-- Light 5 -->
  <circle cx="1760" cy="22" r="8" fill="#2a2f3a"/>
  <ellipse cx="1760" cy="36" rx="4" ry="14" fill="rgba(255,200,120,0.18)"/>

  <!-- Stage floor reflections from screen glow -->
  <ellipse cx="1310" cy="900" rx="500" ry="80" fill="#0550c8" opacity="0.12"/>

  <!-- Audience silhouettes — dark crowd in foreground -->
  <!-- Row 1 — foreground -->
  <ellipse cx="200" cy="980" rx="55" ry="80" fill="#050709"/>
  <ellipse cx="310" cy="990" rx="50" ry="75" fill="#060809"/>
  <ellipse cx="420" cy="975" rx="60" ry="85" fill="#050709"/>
  <ellipse cx="530" cy="988" rx="52" ry="78" fill="#070a0c"/>
  <ellipse cx="640" cy="978" rx="58" ry="82" fill="#050709"/>
  <ellipse cx="750" cy="990" rx="50" ry="76" fill="#06090b"/>
  <ellipse cx="860" cy="980" rx="54" ry="80" fill="#050709"/>
  <ellipse cx="970" cy="988" rx="48" ry="72" fill="#070a0c"/>
  <ellipse cx="1060" cy="976" rx="52" ry="78" fill="#050709"/>
  <ellipse cx="1160" cy="985" rx="50" ry="74" fill="#06090b"/>
  <!-- Row 2 — mid distance -->
  <ellipse cx="150" cy="870" rx="38" ry="55" fill="#080b0f"/>
  <ellipse cx="248" cy="878" rx="34" ry="52" fill="#090c10"/>
  <ellipse cx="346" cy="868" rx="40" ry="58" fill="#080b0f"/>
  <ellipse cx="460" cy="876" rx="36" ry="54" fill="#090c10"/>
  <ellipse cx="572" cy="866" rx="40" ry="60" fill="#080b0f"/>
  <ellipse cx="680" cy="874" rx="35" ry="52" fill="#090c10"/>
  <ellipse cx="790" cy="864" rx="38" ry="56" fill="#080b0f"/>
  <ellipse cx="900" cy="872" rx="33" ry="50" fill="#090c10"/>
  <!-- Row 3 — far -->
  <ellipse cx="200" cy="790" rx="26" ry="38" fill="#0d1016"/>
  <ellipse cx="300" cy="796" rx="24" ry="36" fill="#0e1118"/>
  <ellipse cx="400" cy="788" rx="28" ry="40" fill="#0d1016"/>
  <ellipse cx="500" cy="794" rx="25" ry="37" fill="#0e1118"/>
  <ellipse cx="600" cy="784" rx="27" ry="39" fill="#0d1016"/>
  <ellipse cx="700" cy="792" rx="24" ry="36" fill="#0e1118"/>
  <ellipse cx="800" cy="782" rx="26" ry="38" fill="#0d1016"/>

  <!-- Screen glow spill onto scene -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#screen-glow)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#light-spot-1)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#light-spot-2)"/>

  <!-- Placeholder label — visible but clearly temporary -->
  <rect x="28" y="28" width="440" height="42" rx="3" fill="rgba(8,104,247,0.18)"/>
  <text x="248" y="54" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="3">PLACEHOLDER — REPLACE WITH CLIENT PHOTO</text>
</svg>
