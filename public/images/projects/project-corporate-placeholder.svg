<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0a0e18"/>
  <!-- Stage floor -->
  <ellipse cx="400" cy="440" rx="380" ry="60" fill="#080c14"/>
  <!-- LED screen backdrop -->
  <rect x="80" y="60" width="640" height="310" rx="4" fill="#0d1424"/>
  <!-- LED screen grid lines -->
  <line x1="80" y1="160" x2="720" y2="160" stroke="#162040" stroke-width="1"/>
  <line x1="80" y1="220" x2="720" y2="220" stroke="#162040" stroke-width="1"/>
  <line x1="80" y1="280" x2="720" y2="280" stroke="#162040" stroke-width="1"/>
  <line x1="240" y1="60" x2="240" y2="370" stroke="#162040" stroke-width="1"/>
  <line x1="400" y1="60" x2="400" y2="370" stroke="#162040" stroke-width="1"/>
  <line x1="560" y1="60" x2="560" y2="370" stroke="#162040" stroke-width="1"/>
  <!-- Blue LED screen glow -->
  <rect x="90" y="70" width="620" height="290" rx="2" fill="url(#corp-screen)"/>
  <!-- Podium -->
  <rect x="360" y="350" width="80" height="50" rx="2" fill="#141826"/>
  <rect x="350" y="395" width="100" height="12" rx="1" fill="#1a2030"/>
  <!-- Ambient floor glow -->
  <ellipse cx="400" cy="430" rx="200" ry="30" fill="#0a2060" opacity="0.4"/>
  <!-- Ceiling lights -->
  <circle cx="200" cy="30" r="6" fill="#3060e0" opacity="0.7"/>
  <circle cx="400" cy="20" r="6" fill="#4070f0" opacity="0.8"/>
  <circle cx="600" cy="30" r="6" fill="#3060e0" opacity="0.7"/>
  <!-- Light beams -->
  <polygon points="200,36 170,420 230,420" fill="#1040b0" opacity="0.07"/>
  <polygon points="400,26 360,420 440,420" fill="#1848c0" opacity="0.08"/>
  <polygon points="600,36 570,420 630,420" fill="#1040b0" opacity="0.07"/>
  <defs>
    <linearGradient id="corp-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2860"/>
      <stop offset="40%" stop-color="#1040c0"/>
      <stop offset="70%" stop-color="#0d2860"/>
      <stop offset="100%" stop-color="#081830"/>
    </linearGradient>
  </defs>
</svg>
