<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#060810"/>
  <!-- Crowd silhouette -->
  <rect x="0" y="340" width="800" height="160" fill="#050709"/>
  <path d="M0,340 Q100,310 200,330 Q300,310 400,325 Q500,305 600,322 Q700,308 800,320 L800,340 Z" fill="#080b12"/>
  <!-- LED main screen -->
  <rect x="120" y="30" width="560" height="280" rx="4" fill="#060a18"/>
  <rect x="128" y="38" width="544" height="264" rx="2" fill="url(#concert-screen)"/>
  <!-- Truss structure top -->
  <rect x="60" y="20" width="680" height="14" rx="2" fill="#141820"/>
  <rect x="60" y="14" width="680" height="8" rx="2" fill="#1a2028"/>
  <!-- Moving head lights hanging -->
  <rect x="140" y="14" width="6" height="20" fill="#202830"/>
  <rect x="280" y="14" width="6" height="20" fill="#202830"/>
  <rect x="400" y="14" width="6" height="20" fill="#202830"/>
  <rect x="520" y="14" width="6" height="20" fill="#202830"/>
  <rect x="660" y="14" width="6" height="20" fill="#202830"/>
  <!-- Coloured light beams -->
  <polygon points="143,34 80,500 210,500" fill="#c020e0" opacity="0.07"/>
  <polygon points="283,34 220,460 340,460" fill="#2040e0" opacity="0.06"/>
  <polygon points="403,34 340,500 460,500" fill="#e04020" opacity="0.07"/>
  <polygon points="523,34 460,460 580,460" fill="#20c0e0" opacity="0.06"/>
  <polygon points="663,34 600,500 730,500" fill="#c020e0" opacity="0.07"/>
  <!-- Side trusses -->
  <rect x="80" y="30" width="10" height="300" rx="2" fill="#101420"/>
  <rect x="710" y="30" width="10" height="300" rx="2" fill="#101420"/>
  <!-- Stage floor -->
  <rect x="80" y="330" width="640" height="20" rx="2" fill="#0e1220"/>
  <defs>
    <linearGradient id="concert-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#200060"/>
      <stop offset="25%" stop-color="#8000c0"/>
      <stop offset="50%" stop-color="#e03060"/>
      <stop offset="75%" stop-color="#6000a0"/>
      <stop offset="100%" stop-color="#200060"/>
    </linearGradient>
  </defs>
</svg>
